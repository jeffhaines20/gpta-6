# Binding constraint 4: the budget gate and the golden-trace physics gate are
# mandatory and are never bypassed. Until 2026-08-30 nothing ran them automatically
# - there was no workflow, no hook, and `npm run gates` omitted the budget gate
# entirely while running a physics check that had no assertions at all.
#
# The gates are split by whether a hosted runner can measure them validly, NOT by
# threshold. No threshold is relaxed anywhere in this file.
#
#   fast     - deterministic, browser-free. Golden trace reproduces exactly; the
#              physics assertions are exact. Runs on every push. ~1 minute.
#   geometry - draw calls and triangles, which reproduced to within 1.3% and 0.2%
#              across eleven runs, so they gate cleanly on shared hardware. Chunk
#              stall does NOT: it spanned 5.3-24.2 ms on unchanged code on a
#              dedicated box, and a hosted runner is noisier still. It is recorded
#              as advisory here and gated in full locally at N>=5.
#   full     - everything gating, including stall. Manual only, because on a shared
#              runner it will produce false reds, and the honest answer to that is
#              to not pretend otherwise rather than to raise the threshold.
name: gates

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Gate chunk stall too (expect timing flake on shared runners)'
        type: boolean
        default: false

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: static gates (syntax, golden trace, physics)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax
        run: node tools/check-syntax.mjs
      - name: Golden-trace physics gate
        run: node tools/golden-trace.mjs
      - name: Physics assertions
        run: node tools/physics-test.mjs

  geometry:
    name: budget gate (draw calls + triangles gating, stall advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --no-audit --no-fund

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lighting sweep
        run: node tools/daynight-sweep.mjs

      # Chunk stall is advisory here and nowhere else. See tools/budget.mjs for
      # why, and PROGRESS.md for the ledger entry. Setting this to gate stall on a
      # hosted runner is the wrong fix; run the `full` dispatch or measure locally.
      - name: Budget gate
        env:
          # NOT `inputs.full && '' || '...'`: in Actions expressions the empty
          # string is falsy, so that form falls through to the right-hand side and
          # sets the advisory even when a full gating run was explicitly requested -
          # the exact opposite of what it reads as. '(none)' matches no metric name.
          BUDGET_ADVISORY: ${{ inputs.full && '(none)' || 'chunk stall ms' }}
        run: node tools/drive-through.mjs --traffic

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-measurements
          path: |
            docs/drive-traffic.json
            docs/daynight.json
            docs/daynight-negative.json
          if-no-files-found: warn

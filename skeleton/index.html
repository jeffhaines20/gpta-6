<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walking Skeleton — coupled core probe</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8fb4d8;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff}
  #c{display:block;width:100%;height:100%}
  #hud{position:fixed;left:14px;top:12px;padding:7px 11px;border-radius:5px;
    background:rgba(8,12,18,.62);letter-spacing:.03em;white-space:pre}
  #prompt{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);
    padding:9px 16px;border-radius:5px;background:rgba(8,12,18,.72);
    opacity:0;transition:opacity .15s;font-weight:600;letter-spacing:.06em}
  #help{position:fixed;right:14px;bottom:12px;padding:7px 11px;border-radius:5px;
    background:rgba(8,12,18,.5);opacity:.85}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="prompt">[F] ENTER VEHICLE</div>
<div id="help">click to capture mouse · WASD · Shift run · Space jump/handbrake · F enter/exit</div>
<script type="module" src="./main.js"></script>
</body>
</html>

<!doctype html><meta charset="utf-8"><title>sky probe</title>
<canvas id="c" width="640" height="360"></canvas>
<script type="module">
import * as THREE from '../../vendor/three.module.min.js';
import { Sky } from '../../src/sky.js';
const out = { rows: [], errors: [] };
window.__probe = out;
window.addEventListener('error', e => out.errors.push('ERR ' + e.message));
try {
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c') });
  const scene = new THREE.Scene();
  const sky = new Sky(renderer, scene, { environment: false });
  const az = 2.72;
  for (const elevDeg of [-1.5, -0.6, 0, 0.3, 0.6, 1.0, 1.6, 2.2, 3.15, 5, 8, 14, 30, 55, 75.6]) {
    const e = elevDeg * Math.PI / 180;
    sky.setSun(e, az); sky.setTurbidity(3.2); sky.setOvercast(0);
    sky.refresh({ force: true });
    const a = sky.atmosphere;
    out.rows.push({
      elevDeg, skyLux: +a.skyLux.toFixed(1), sunLux: +a.sunLux.toFixed(0),
      zen: +a.zenithNits.toFixed(2), hor: +a.horizonNits.toFixed(1),
      fog: [a.fogColor.r, a.fogColor.g, a.fogColor.b].map(v => +v.toFixed(1)),
      insc: [a.fogInscatter.r, a.fogInscatter.g, a.fogInscatter.b].map(v => +v.toFixed(1)),
    });
  }
  // overcast sweep at the noon elevation
  out.overcast = [];
  sky.setSun(75.6 * Math.PI / 180, 0.6); sky.setTurbidity(2.4);
  for (const o of [0, 0.5, 1]) {
    sky.setOvercast(o); sky.refresh({ force: true });
    const a = sky.atmosphere;
    out.overcast.push({ o, skyLux: +a.skyLux.toFixed(0), hor: +a.horizonNits.toFixed(0),
      fog: [a.fogColor.r, a.fogColor.g, a.fogColor.b].map(v => +v.toFixed(0)) });
  }
  out.ready = true;
} catch (e) { out.errors.push('THROW ' + (e && e.stack || e)); out.ready = true; }
</script>

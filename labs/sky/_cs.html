<!doctype html><meta charset="utf-8"><body style="margin:0">
<script type="module">
import * as THREE from '../../vendor/three.module.min.js';
const r = new THREE.WebGLRenderer({ antialias:false, preserveDrawingBuffer:true });
r.setPixelRatio(1); r.setSize(64,64); r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.NoToneMapping;
document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); const cam = new THREE.Camera();
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute([-1,-1,0, 3,-1,0, -1,3,0],3));
geo.setAttribute('uv', new THREE.Float32BufferAttribute([0,0, 2,0, 0,2],2));
const raw = new THREE.RawShaderMaterial({
  vertexShader:'precision highp float; attribute vec3 position; void main(){ gl_Position=vec4(position.xy,0.,1.); }',
  fragmentShader:'precision highp float; void main(){ gl_FragColor=vec4(0.5,0.5,0.5,1.0); }',
  depthTest:false });
const shad = new THREE.ShaderMaterial({
  vertexShader:'void main(){ gl_Position=vec4(position.xy,0.,1.); }',
  fragmentShader:'void main(){ gl_FragColor=vec4(0.5,0.5,0.5,1.0);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n }',
  depthTest:false });
const mesh = new THREE.Mesh(geo, raw); mesh.frustumCulled=false; sc.add(mesh);
const buf = new Uint8Array(4);
function read(){ const gl=r.getContext(); gl.readPixels(32,32,1,1,gl.RGBA,gl.UNSIGNED_BYTE,buf); return [...buf]; }
const out = {};
mesh.material = raw; r.render(sc,cam); out.rawNoTM = read();
mesh.material = shad; shad.needsUpdate=true; r.render(sc,cam); out.shaderNoTM = read();
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1;
shad.needsUpdate = true; r.render(sc,cam); out.shaderACES = read();
// render into a half-float target with ShaderMaterial, then read via a raw blit
const rt = new THREE.WebGLRenderTarget(64,64,{type:THREE.HalfFloatType});
r.setRenderTarget(rt); mesh.material=shad; shad.needsUpdate=true; r.render(sc,cam);
const fbuf = new Uint16Array(4); const gl=r.getContext();
gl.readPixels(32,32,1,1,gl.RGBA,gl.HALF_FLOAT,fbuf);
out.intoRT_half = [...fbuf].map(h=>THREE.DataUtils.fromHalfFloat(h));
r.setRenderTarget(null);
window.__out = out;
</script>

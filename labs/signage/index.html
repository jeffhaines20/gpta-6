<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Port Verano — signage, wordmarks &amp; street signs</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14;
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#e8edf5}
  #c{display:block;width:100%;height:100%}
  #hud{position:fixed;left:12px;top:11px;padding:9px 13px;border-radius:6px;
    background:rgba(6,10,16,.72);white-space:pre;letter-spacing:.02em;
    border:1px solid rgba(120,150,190,.22);max-width:52ch}
  #keys{position:fixed;right:12px;bottom:10px;padding:7px 11px;border-radius:5px;
    background:rgba(6,10,16,.6);opacity:.9}
  #load{position:fixed;inset:0;display:grid;place-items:center;background:#0b0e14;
    font-size:14px;color:#8ea6c4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">generating…</div>
<div id="keys">&nbsp; 1/2/3 noon · dusk · night &nbsp;|&nbsp; 4/5/6/7 camera &nbsp;|&nbsp; drag to orbit · wheel to zoom</div>
<div id="load">generating signage atlases…</div>
<script type="module" src="./main.js"></script>
</body></html>

<!doctype html>
<meta charset="utf-8">
<title>star-strokes</title>
<!--
  BACKLOG #124, its first item: night-sky specks carried 1-px straight bracket-like strokes.

  src/sky.js draws one star per occupied cell of a 3D lattice over the view direction, and measured
  the star's size in pixels as dist / fwidth(dist). `dist` is a distance to the star inside ITS cell,
  so it jumps at every cell face, and fwidth() of a jump is the jump: across the one pixel row that
  straddles a face the "pixel size" is a whole cell, px collapses toward 0, and the pixel lights at
  the star's full core. An occupied cell therefore draws its own faces as 1-px lines — straight,
  because a plane cut through a sphere is a nearly straight curve over a few pixels — which is the
  bracket a reviewer measured round two stars at fivepoints night.

  The fix measures the pixel against the CONTINUOUS coordinate the lattice is cut from. This page
  renders the real Sky at the night preset through the real PostStack, looking up where the city is
  not, twice off one load — uStarAA 0 is the build before, 1 shipped — and finds every star as a
  connected bright component, so a stroke shows as a component that is long and mostly empty.
-->
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
import { PostStack } from '../src/post.js';
import { Sky, setStarAA, starAA } from '../src/sky.js';

const qs = new URLSearchParams(location.search);
const W = Number(qs.get('w') ?? 960), H = Number(qs.get('h') ?? 540);
try {
  const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  // The hero framings' vertical field of view, looking up into open sky.
  const camera = new THREE.PerspectiveCamera(48, W / H, 0.2, 2000);
  camera.position.set(0, 1.6, 0);
  const el = Number(qs.get('el') ?? 38) * Math.PI / 180, az = Number(qs.get('az') ?? 20) * Math.PI / 180;
  camera.lookAt(Math.sin(az) * Math.cos(el), 1.6 + Math.sin(el), Math.cos(az) * Math.cos(el));
  camera.updateMatrixWorld(true);

  const sky = new Sky(renderer, scene, { environment: false, milkyWay: false });
  sky.setTimeOfDay('night');
  sky.refresh({ force: true, environment: false, sync: true });
  const post = new PostStack(renderer, scene, camera);
  post.setSize(W, H);
  post.params.exposure = 1 / 5.378;           // src/daynight.js's night stop
  post.params.bloomStrength = 0;              // one term: bloom would spread a stroke and a star alike
  sky.applyToPost(post);
  sky.update(camera);

  const gl = renderer.getContext();
  const grab = () => {
    const px = new Uint8Array(W * H * 4);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const out = new Uint8Array(W * H * 3);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const s = ((H - 1 - y) * W + x) * 4, d = (y * W + x) * 3;
      out[d] = px[s]; out[d + 1] = px[s + 1]; out[d + 2] = px[s + 2];
    }
    return out;
  };
  const shipped = starAA();
  const arm = (k) => { setStarAA(k); sky.update(camera); post.render(); return { k, read: starAA(), rgb: grab() }; };
  const arms = { before: arm(0), after: arm(1) };
  setStarAA(shipped);

  const lin = new Float64Array(256);
  for (let i = 0; i < 256; i++) { const c = i / 255; lin[i] = c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; }
  const luma = (rgb, i) => 0.2126 * lin[rgb[i * 3]] + 0.7152 * lin[rgb[i * 3 + 1]] + 0.0722 * lin[rgb[i * 3 + 2]];

  // Components of pixels brighter than the sky by a margin read off the frame itself: the median plus
  // eight times the median absolute deviation, so an exposure change cannot move what counts.
  const components = (rgb) => {
    const L = new Float64Array(W * H);
    for (let i = 0; i < W * H; i++) L[i] = luma(rgb, i);
    const sorted = Float64Array.from(L).sort();
    const med = sorted[sorted.length >> 1];
    const dev = Float64Array.from(L, (v) => Math.abs(v - med)).sort();
    const mad = dev[dev.length >> 1];
    const thr = med + Math.max(8 * mad, 0.25 * med, 1e-5);
    const seen = new Uint8Array(W * H);
    const out = [];
    for (let i = 0; i < W * H; i++) {
      if (seen[i] || L[i] <= thr) continue;
      const st = [i]; seen[i] = 1;
      let n = 0, x0 = W, x1 = 0, y0 = H, y1 = 0, peak = 0;
      while (st.length) {
        const j = st.pop(), x = j % W, y = (j / W) | 0;
        n++; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); peak = Math.max(peak, L[j]);
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx, yy = y + dy;
          if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
          const k = yy * W + xx;
          if (!seen[k] && L[k] > thr) { seen[k] = 1; st.push(k); }
        }
      }
      const w = x1 - x0 + 1, h = y1 - y0 + 1;
      out.push({ n, w, h, fill: n / (w * h), peak });
    }
    return { med, mad, thr, list: out };
  };
  const summarise = (c) => {
    const big = c.list.filter((q) => q.n >= 4);
    // A STROKE: a component whose extent outruns its pixels — longer than 4 px and under half full.
    const strokes = big.filter((q) => Math.max(q.w, q.h) >= 4 && q.fill < 0.5);
    const lineish = c.list.filter((q) => (q.w === 1 || q.h === 1) && Math.max(q.w, q.h) >= 3);
    return { background: c.med, threshold: c.thr, components: c.list.length, sized: big.length,
      strokes: strokes.length, lines: lineish.length,
      worstFill: big.length ? Math.min(...big.map((q) => q.fill)) : null,
      // The brightest star's peak, so a fix that dims the stars is not read as one that removed strokes.
      peakMax: c.list.length ? Math.max(...c.list.map((q) => q.peak)) : null,
      longest: c.list.length ? Math.max(...c.list.map((q) => Math.max(q.w, q.h))) : null };
  };
  const cb = components(arms.before.rgb), ca = components(arms.after.rgb);
  const before = summarise(cb), after = summarise(ca);
  // THE SAME STARS, MATCHED: every local maximum of the after arm above its threshold, and the brightest
  // pixel within 2 px of it in each arm. The brightest pixel of a whole frame is the wrong statistic —
  // in the before arm it was a STROKE pixel beside a star, lit at the core's full value — so the
  // question "did the fix dim the stars" is asked per star and answered by the median.
  const La = new Float64Array(W * H), Lb = new Float64Array(W * H);
  for (let i = 0; i < W * H; i++) { La[i] = luma(arms.after.rgb, i); Lb[i] = luma(arms.before.rgb, i); }
  const ratios = [];
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
    const v = La[y * W + x];
    if (v <= ca.thr) continue;
    let isMax = true;
    for (let dy = -1; dy <= 1 && isMax; dy++) for (let dx = -1; dx <= 1; dx++) {
      if ((dx || dy) && La[(y + dy) * W + x + dx] > v) { isMax = false; break; }
    }
    if (!isMax) continue;
    let pa = 0, pb = 0;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      pa = Math.max(pa, La[(y + dy) * W + x + dx]); pb = Math.max(pb, Lb[(y + dy) * W + x + dx]);
    }
    if (pb > 0) ratios.push(pa / pb);
  }
  ratios.sort((p, q) => p - q);
  const matched = { stars: ratios.length, medianRatio: ratios.length ? ratios[ratios.length >> 1] : null,
    p10: ratios.length ? ratios[Math.floor(0.1 * (ratios.length - 1))] : null };
  window.__stars = { size: { w: W, h: H }, shipped, arms: { before: arms.before.read, after: arms.after.read },
    before, after, matched };
  if (qs.get('debug') === '1') {
    const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode(...u8.subarray(i, i + 8192)); return btoa(s); };
    window.__starsFrames = { before: b64(arms.before.rgb), after: b64(arms.after.rgb) };
  }
} catch (e) {
  window.__stars = { error: String(e && e.stack || e) };
}
</script>
